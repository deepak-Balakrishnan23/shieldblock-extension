name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          for file in *.js scriptlets/*.js rules/generated/index.js; do
            node --check "$file"
          done

      - name: Unit tests
        run: npm test

      # Chrome rejects an entire ruleset file when a single rule inside it is
      # malformed, so the packaged rules are checked against its documented
      # limits on every push rather than at install time on a user's machine.
      - name: Validate packaged rulesets
        run: npm run validate:rules
