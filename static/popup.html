<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldBlock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="popup-shell">
    <main class="panel">
      <section class="hero">
        <div>
          <div class="eyebrow">ShieldBlock</div>
          <h1>Block distractions before they land.</h1>
          <p>MV3 rules stop navigations, while the content overlay closes gaps on live tabs and single-page apps.</p>
        </div>
      </section>

      <section class="grid compact-grid">
        <article class="card stat-card">
          <span class="stat-value" id="total-blocked">0</span>
          <span class="stat-label">Total blocks</span>
        </article>
        <article class="card stat-card">
          <span class="stat-value" id="blocked-today">0</span>
          <span class="stat-label">Today</span>
        </article>
      </section>

      <section class="card stack">
        <label class="switch-row">
          <span>Blocking enabled</span>
          <input id="enabled" type="checkbox" checked />
        </label>
        <label class="switch-row">
          <span>Strict mode</span>
          <input id="strict-mode" type="checkbox" checked />
        </label>
      </section>

      <section class="card stack">
        <div class="section-title">Active tab</div>
        <div id="current-site" class="headline-sm">No active page</div>
        <div id="current-meta" class="muted">Open a tab to inspect live blocking state.</div>
        <button id="allowlist-toggle" class="ghost wide">Allow this site</button>
      </section>

      <section class="card stack">
        <div class="section-title">Add a blocking rule</div>
        <form id="add-form" class="input-row">
          <input id="site-input" placeholder="youtube.com, https://site.com/path, /regex/" />
          <button class="primary" type="submit">Add</button>
        </form>
        <div id="feedback" class="feedback" aria-live="polite"></div>
      </section>

      <section class="card stack">
        <div class="section-title">Blocked sites</div>
        <div id="block-list" class="list"></div>
      </section>

      <section class="card stack">
        <div class="section-title">Focus schedule</div>
        <label class="switch-row">
          <span>Use schedule</span>
          <input id="schedule-enabled" type="checkbox" />
        </label>
        <div class="time-grid">
          <label>
            <span>Start</span>
            <input id="schedule-start" type="time" value="09:00" />
          </label>
          <label>
            <span>End</span>
            <input id="schedule-end" type="time" value="17:00" />
          </label>
        </div>
        <div class="days-row">
          <label><input data-day="1" type="checkbox" checked />Mon</label>
          <label><input data-day="2" type="checkbox" checked />Tue</label>
          <label><input data-day="3" type="checkbox" checked />Wed</label>
          <label><input data-day="4" type="checkbox" checked />Thu</label>
          <label><input data-day="5" type="checkbox" checked />Fri</label>
          <label><input data-day="6" type="checkbox" />Sat</label>
          <label><input data-day="0" type="checkbox" />Sun</label>
        </div>
        <button id="save-schedule" class="primary wide" type="button">Save schedule</button>
      </section>

      <button id="open-options" class="ghost wide" type="button">Open full settings</button>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
