<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldBlock AI</title>
    <style>
      :root {
        --radius-card: 20px;
        --radius-inner: 14px;
        --radius-pill: 999px;
        --font: "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
        --trans: 160ms cubic-bezier(.4,0,.2,1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:          #0d1117;
          --surface:     #161b22;
          --surface-2:   #21262d;
          --border:      rgba(255,255,255,.08);
          --border-2:    rgba(255,255,255,.04);
          --text:        #f0f6fc;
          --text-2:      #8b949e;
          --accent:      #58d4ff;
          --accent-dim:  rgba(88,212,255,.14);
          --green:       #3fb950;
          --green-dim:   rgba(63,185,80,.15);
          --red:         #f85149;
          --stat-bg:     rgba(255,255,255,.04);
          --stat-border: rgba(255,255,255,.06);
          --glow:        0 0 0 3px rgba(88,212,255,.15);
        }
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg:          #f6f8fa;
          --surface:     #ffffff;
          --surface-2:   #f0f3f6;
          --border:      rgba(0,0,0,.09);
          --border-2:    rgba(0,0,0,.05);
          --text:        #1c2128;
          --text-2:      #57606a;
          --accent:      #0969da;
          --accent-dim:  rgba(9,105,218,.1);
          --green:       #1a7f37;
          --green-dim:   rgba(26,127,55,.12);
          --red:         #cf222e;
          --stat-bg:     #f6f8fa;
          --stat-border: rgba(0,0,0,.07);
          --glow:        0 0 0 3px rgba(9,105,218,.12);
        }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 360px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.45;
        padding: 11px;
        overflow: hidden;
      }

      .shell { display: flex; flex-direction: column; gap: 7px; }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        overflow: hidden;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 15px;
      }

      .brand { display: flex; align-items: center; gap: 11px; }

      .logo {
        width: 38px; height: 38px;
        border-radius: 11px;
        background: linear-gradient(145deg, #1c6ef3, #0d4db8);
        display: grid; place-items: center;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(28,110,243,.4);
      }

      .logo svg {
        width: 20px; height: 20px;
        fill: none; stroke: #fff;
        stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--text-2);
        font-weight: 500;
      }
      .brand-name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -.025em;
        line-height: 1.15;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: var(--radius-pill);
        font-size: 12px;
        font-weight: 600;
        border: 1px solid transparent;
        transition: background var(--trans), color var(--trans);
      }
      .status-pill[data-on="true"] {
        background: var(--green-dim);
        color: var(--green);
        border-color: rgba(63,185,80,.2);
      }
      .status-pill[data-on="false"] {
        background: rgba(248,81,73,.12);
        color: var(--red);
        border-color: rgba(248,81,73,.2);
      }
      .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

      /* Toggle row */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 15px;
        border-top: 1px solid var(--border-2);
      }
      .toggle-label { font-weight: 600; font-size: 13.5px; }
      .toggle-sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }

      .switch { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0;
        border-radius: var(--radius-pill);
        background: var(--surface-2);
        border: 1px solid var(--border);
        transition: background var(--trans), box-shadow var(--trans);
        cursor: pointer;
      }
      .slider::before {
        content: "";
        position: absolute;
        top: 3px; left: 3px;
        width: 17px; height: 17px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,.22);
        transition: transform var(--trans);
      }
      .switch input:checked + .slider {
        background: linear-gradient(135deg, #1c6ef3, #0d4db8);
        border-color: transparent;
        box-shadow: var(--glow);
      }
      .switch input:checked + .slider::before { transform: translateX(19px); }
      .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 3px; }

      /* Stats 3-col */
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 9px; }

      .stat {
        background: var(--stat-bg);
        border: 1px solid var(--stat-border);
        border-radius: var(--radius-inner);
        padding: 9px 10px 10px;
      }
      .stat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--text-2);
        font-size: 11px;
        font-weight: 500;
      }
      .stat-icon {
        width: 19px; height: 19px;
        border-radius: 6px;
        background: var(--accent-dim);
        color: var(--accent);
        display: grid; place-items: center;
        font-size: 10px; font-weight: 700;
        border: 1px solid rgba(88,212,255,.1);
        flex-shrink: 0;
      }
      @media (prefers-color-scheme: light) {
        .stat-icon { border-color: rgba(9,105,218,.12); }
      }
      .stat-value {
        margin-top: 7px;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -.04em;
        line-height: 1;
      }

      /* Bottom row */
      .bottom-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
      }
      .site-info { flex: 1; min-width: 0; }
      .site-label {
        font-size: 10px; letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--text-2); font-weight: 500;
      }
      .site-domain {
        font-size: 13px; font-weight: 700;
        letter-spacing: -.02em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        margin-top: 2px;
      }

      .bottom-actions { display: flex; gap: 6px; flex-shrink: 0; }

      .btn {
        height: 31px; padding: 0 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font: 600 12px/1 var(--font);
        cursor: pointer;
        display: inline-flex; align-items: center;
        transition: background var(--trans), border-color var(--trans), transform var(--trans);
      }
      .btn:hover:not(:disabled) {
        background: var(--accent-dim);
        border-color: rgba(88,212,255,.25);
        transform: translateY(-1px);
      }
      @media (prefers-color-scheme: light) {
        .btn:hover:not(:disabled) { border-color: rgba(9,105,218,.25); }
      }
      .btn:disabled { opacity: .4; cursor: not-allowed; }

      .btn-icon {
        width: 31px; height: 31px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-2);
        font-size: 15px;
        cursor: pointer;
        display: grid; place-items: center;
        transition: background var(--trans), color var(--trans), transform var(--trans);
      }
      .btn-icon:hover {
        background: var(--accent-dim);
        color: var(--accent);
        border-color: rgba(88,212,255,.25);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="shell">

      <section class="card">
        <div class="header">
          <div class="brand">
            <div class="logo" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 2.6 19 5.7v5.4c0 4.8-2.8 8.3-7 10.3-4.2-2-7-5.5-7-10.3V5.7L12 2.6Z"/>
                <path d="m9.2 12.4 1.9 1.9 3.9-4.6"/>
              </svg>
            </div>
            <div>
              <div class="eyebrow">ShieldBlock AI</div>
              <div class="brand-name">Focus Control</div>
            </div>
          </div>
          <div class="status-pill" id="status-badge" data-on="true">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Enabled</span>
          </div>
        </div>

        <div class="toggle-row">
          <div>
            <div class="toggle-label">Master Protection</div>
            <div class="toggle-sub" id="toggle-copy">All protection layers are active.</div>
          </div>
          <label class="switch" aria-label="Toggle ShieldBlock AI">
            <input id="master-toggle" type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <section class="card stats">
        <article class="stat">
          <div class="stat-head"><span>Ads</span><span class="stat-icon">A</span></div>
          <div class="stat-value" id="ads-count">0</div>
        </article>
        <article class="stat">
          <div class="stat-head"><span>Trackers</span><span class="stat-icon">T</span></div>
          <div class="stat-value" id="trackers-count">0</div>
        </article>
        <article class="stat">
          <div class="stat-head"><span>Cosmetic</span><span class="stat-icon">C</span></div>
          <div class="stat-value" id="cosmetic-count">0</div>
        </article>
        <article class="stat">
          <div class="stat-head"><span>Heuristic</span><span class="stat-icon">H</span></div>
          <div class="stat-value" id="heuristic-count">0</div>
        </article>
        <article class="stat">
          <div class="stat-head"><span>ML</span><span class="stat-icon">M</span></div>
          <div class="stat-value" id="ml-count">0</div>
        </article>
        <article class="stat">
          <div class="stat-head"><span>Phishing</span><span class="stat-icon">P</span></div>
          <div class="stat-value" id="phishing-count">0</div>
        </article>
      </section>

      <section class="card bottom-row">
        <div class="site-info">
          <div class="site-label">Current Site</div>
          <div class="site-domain" id="current-domain">No active site</div>
        </div>
        <div class="bottom-actions">
          <button class="btn" id="allowlist-button" type="button" disabled>Allowlist</button>
          <button class="btn-icon" id="refresh-lists" type="button" aria-label="Refresh filter lists" title="Refresh filters">↻</button>
          <button class="btn" id="open-options" type="button">Options</button>
        </div>
      </section>

    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
