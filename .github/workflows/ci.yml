name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shieldblock-extension/package-lock.json

      - name: Install dependencies
        working-directory: shieldblock-extension
        run: npm ci

      - name: Lint
        working-directory: shieldblock-extension
        run: npm run lint

      - name: Typecheck
        working-directory: shieldblock-extension
        run: npm run typecheck

      - name: Unit tests
        working-directory: shieldblock-extension
        run: npm test

      - name: Build extension
        working-directory: shieldblock-extension
        run: npm run build

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: shieldblock-chrome
          path: shieldblock-extension/dist/chrome

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: shieldblock-firefox
          path: shieldblock-extension/dist/firefox
