<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldBlock AI</title>
    <style>
      /* ============================================================
         Design tokens — single source of truth for color, type, space
         ============================================================ */
      :root {
        /* Spacing scale (4px base) */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;

        /* Radii */
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-pill: 999px;

        /* Type scale */
        --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --fs-xs: 11px;
        --fs-sm: 12px;
        --fs-base: 13px;
        --fs-md: 15px;
        --fs-lg: 18px;
        --fs-2xl: 26px;
        --lh: 1.45;

        /* Brand gradient */
        --grad-1: #7c3aed;
        --grad-2: #6366f1;
        --grad-3: #3b82f6;

        /* Semantic accent colors (shared) */
        --c-ads: #f87171;
        --c-trackers: #38bdf8;
        --c-data: #c084fc;
        --c-cosmetic: #f472b6;
        --c-heuristic: #2dd4bf;
        --c-ml: #a78bfa;
        --c-threats: #fb7185;

        --motion: 180ms cubic-bezier(.4, 0, .2, 1);
      }

      /* ---- Dark theme (default) ---- */
      :root {
        --bg-0: #0b0a1f;
        --bg-1: #16132e;
        --blob-1: rgba(124, 58, 237, .45);
        --blob-2: rgba(59, 130, 246, .35);
        --blob-3: rgba(236, 72, 153, .28);
        --surface: rgba(255, 255, 255, .055);
        --surface-2: rgba(255, 255, 255, .085);
        --border: rgba(255, 255, 255, .11);
        --border-strong: rgba(255, 255, 255, .2);
        --text: #f1f3fb;
        --text-2: #a9b2d6;
        --text-3: #7c84a6;
        --good: #34d399;
        --bad: #fb7185;
        --shadow: 0 16px 40px -16px rgba(0, 0, 0, .7);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-6%, 5%); }
      }

      html { color-scheme: dark; }

      body {
        width: 384px;
        font-family: var(--font);
        font-size: var(--fs-base);
        line-height: var(--lh);
        color: var(--text);
        background: var(--bg-0);
        position: relative;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Ambient colored blur behind the glass */
      body::before {
        content: "";
        position: fixed;
        inset: -40%;
        z-index: 0;
        background:
          radial-gradient(40% 40% at 20% 18%, var(--blob-1), transparent 70%),
          radial-gradient(45% 45% at 85% 25%, var(--blob-2), transparent 70%),
          radial-gradient(50% 50% at 75% 95%, var(--blob-3), transparent 70%),
          linear-gradient(160deg, var(--bg-1), var(--bg-0));
        animation: float 14s ease-in-out infinite;
        pointer-events: none;
      }

      .app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        padding: var(--space-3);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        box-shadow: var(--shadow);
      }

      /* ===================== Hero ===================== */
      .hero {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4);
      }
      .hero-icon {
        width: 46px; height: 46px;
        display: grid; place-items: center;
        border-radius: var(--radius-md);
        background: linear-gradient(150deg, rgba(124, 58, 237, .25), rgba(59, 130, 246, .2));
        border: 1px solid var(--border-strong);
        box-shadow: 0 6px 18px -8px var(--grad-1);
      }
      .hero-icon img { width: 32px; height: 32px; display: block; }
      .hero-title { font-size: var(--fs-lg); font-weight: 750; letter-spacing: -.02em; }
      .hero-sub { font-size: var(--fs-sm); color: var(--text-2); margin-top: 1px; }
      .hero-sub strong { font-weight: 700; }
      #status-text[data-on="true"] { color: var(--good); }
      #status-text[data-on="false"] { color: var(--bad); }

      /* Primary action with a raised, glassy 3D feel */
      .toggle-pill {
        display: inline-flex; align-items: center; gap: var(--space-2);
        height: 40px; padding: 0 16px 0 13px;
        border-radius: var(--radius-pill);
        font: 750 var(--fs-sm)/1 var(--font);
        color: #fff;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, .28);
        background: linear-gradient(180deg, #9b7bff 0%, #7c3aed 55%, #6d28d9 100%);
        backdrop-filter: blur(10px) saturate(150%);
        -webkit-backdrop-filter: blur(10px) saturate(150%);
        text-shadow: 0 1px 2px rgba(76, 29, 149, .55);
        box-shadow:
          0 10px 20px -6px rgba(124, 58, 237, .7),
          0 2px 4px rgba(0, 0, 0, .25),
          inset 0 1px 0 rgba(255, 255, 255, .55),
          inset 0 -3px 8px rgba(76, 29, 149, .5);
        transition: transform var(--motion), box-shadow var(--motion), filter var(--motion);
      }
      .toggle-pill:hover { filter: brightness(1.07); transform: translateY(-1px); }
      .toggle-pill:active {
        transform: translateY(1px);
        box-shadow:
          0 3px 9px -4px rgba(124, 58, 237, .6),
          inset 0 2px 7px rgba(76, 29, 149, .6),
          inset 0 1px 0 rgba(255, 255, 255, .3);
      }
      /* Disabled state: recessed glass chip */
      .toggle-pill[aria-pressed="false"] {
        background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .05));
        color: var(--text-2);
        border-color: var(--border-strong);
        text-shadow: none;
        box-shadow:
          0 4px 10px -6px rgba(0, 0, 0, .5),
          inset 0 1px 0 rgba(255, 255, 255, .18),
          inset 0 -2px 5px rgba(0, 0, 0, .25);
      }
      .toggle-pill svg { width: 16px; height: 16px; }

      /* ===================== Primary stats ===================== */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: var(--space-4) var(--space-2);
      }
      .stat {
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        padding: 0 var(--space-2);
        position: relative;
      }
      .stat + .stat::before {
        content: ""; position: absolute; left: 0; top: 8%;
        height: 84%; width: 1px; background: var(--border);
      }
      .stat-icon {
        width: 38px; height: 38px;
        display: grid; place-items: center;
        border-radius: 12px;
        margin-bottom: var(--space-2);
        background: color-mix(in srgb, currentColor 16%, transparent);
        border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
      }
      .stat-icon svg { width: 19px; height: 19px; }
      .stat-icon.ads { color: var(--c-ads); }
      .stat-icon.trackers { color: var(--c-trackers); }
      .stat-icon.data { color: var(--c-data); }
      .stat-name { font-size: var(--fs-sm); color: var(--text-2); font-weight: 600; }
      .stat-value {
        font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.03em;
        margin-top: var(--space-1); line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }
      .stat-delta { font-size: var(--fs-xs); color: var(--good); font-weight: 650; margin-top: 2px; }

      /* ===================== Secondary breakdown ===================== */
      .breakdown {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: var(--space-1);
        padding: var(--space-3);
      }
      .mini { display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .mini-label { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--text-3); font-weight: 600; }
      .mini-dot { width: 7px; height: 7px; border-radius: 50%; }
      .mini-dot.cosmetic { background: var(--c-cosmetic); }
      .mini-dot.heuristic { background: var(--c-heuristic); }
      .mini-dot.ml { background: var(--c-ml); }
      .mini-dot.threats { background: var(--c-threats); }
      .mini-value { font-size: var(--fs-md); font-weight: 750; font-variant-numeric: tabular-nums; }

      /* ===================== Page / allowlist row ===================== */
      .page-row {
        display: grid; grid-template-columns: auto 1fr auto;
        align-items: center; gap: var(--space-3);
        width: 100%; text-align: left;
        padding: var(--space-3) var(--space-4);
        cursor: pointer; color: inherit;
        font-family: var(--font);
        transition: background var(--motion);
      }
      .page-row:hover:not(:disabled) { background: var(--surface-2); }
      .page-row:disabled { cursor: default; opacity: .8; }
      .page-icon {
        width: 40px; height: 40px; flex-shrink: 0;
        display: grid; place-items: center;
        border-radius: 12px;
        background: color-mix(in srgb, var(--good) 16%, transparent);
        color: var(--good);
      }
      .page-row[data-allowlisted="true"] .page-icon {
        background: color-mix(in srgb, var(--bad) 16%, transparent);
        color: var(--bad);
      }
      .page-icon svg { width: 20px; height: 20px; }
      .page-title { font-size: var(--fs-base); font-weight: 700; }
      .page-sub { font-size: var(--fs-sm); color: var(--text-2); margin-top: 1px; }
      .page-sub strong { color: var(--text); font-weight: 700; }
      .chevron { color: var(--text-3); font-size: 20px; line-height: 1; }

      /* ===================== Footer ===================== */
      .footer { display: flex; gap: var(--space-2); }
      .link {
        flex: 1;
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        height: 38px; border-radius: var(--radius-md);
        background: var(--surface); border: 1px solid var(--border);
        color: var(--text-2); cursor: pointer;
        font: 650 var(--fs-sm)/1 var(--font);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: background var(--motion), color var(--motion);
      }
      .link:hover { background: var(--surface-2); color: var(--text); }
      .link svg { width: 15px; height: 15px; }

      /* ===================== Accessibility ===================== */
      :focus-visible {
        outline: 2px solid var(--grad-2);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        *, body::before { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="app">

      <!-- Hero -->
      <header class="hero card">
        <span class="hero-icon" aria-hidden="true">
          <img src="icons/logo.svg" width="32" height="32" alt="" />
        </span>
        <div>
          <div class="hero-title">ShieldBlock AI</div>
          <div class="hero-sub">Protection is <strong id="status-text" data-on="true">Enabled</strong></div>
        </div>
        <button class="toggle-pill" id="master-toggle" type="button" aria-pressed="true" aria-label="Toggle protection">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v8" />
            <path d="M7.8 6.3a6 6 0 1 0 8.4 0" />
          </svg>
          <span id="toggle-label">Enabled</span>
        </button>
      </header>

      <!-- Primary stats -->
      <section class="card stats" aria-label="Blocking statistics">
        <article class="stat">
          <span class="stat-icon ads" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
          </span>
          <div class="stat-name">Ads Blocked</div>
          <div class="stat-value" id="ads-count">0</div>
          <div class="stat-delta" id="ads-today">+0 today</div>
        </article>
        <article class="stat">
          <span class="stat-icon trackers" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7a11 11 0 0 1-5.5-1.5"/><path d="m3 3 18 18"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <div class="stat-name">Trackers</div>
          <div class="stat-value" id="trackers-count">0</div>
          <div class="stat-delta" id="trackers-today">+0 today</div>
        </article>
        <article class="stat">
          <span class="stat-icon data" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 13 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
          </span>
          <div class="stat-name">Data Saved</div>
          <div class="stat-value" id="data-saved">0</div>
          <div class="stat-delta" id="data-saved-today">+0 today</div>
        </article>
      </section>

      <!-- Secondary breakdown -->
      <section class="card breakdown" aria-label="Detailed breakdown">
        <div class="mini">
          <span class="mini-label"><span class="mini-dot cosmetic"></span>Cosmetic</span>
          <span class="mini-value" id="cosmetic-count">0</span>
        </div>
        <div class="mini">
          <span class="mini-label"><span class="mini-dot heuristic"></span>Heuristic</span>
          <span class="mini-value" id="heuristic-count">0</span>
        </div>
        <div class="mini">
          <span class="mini-label"><span class="mini-dot ml"></span>AI</span>
          <span class="mini-value" id="ml-count">0</span>
        </div>
        <div class="mini">
          <span class="mini-label"><span class="mini-dot threats"></span>Threats</span>
          <span class="mini-value" id="phishing-count">0</span>
        </div>
      </section>

      <!-- Current page / allowlist toggle -->
      <button class="card page-row" id="allowlist-button" type="button" data-allowlisted="false" disabled>
        <span class="page-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 5 5.5v5c0 4.3 2.9 7.5 7 9 4.1-1.5 7-4.7 7-9v-5L12 3Z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <span class="page-text">
          <span class="page-title" id="page-title">This page is protected</span>
          <span class="page-sub" id="page-sub">Blocking ads and trackers on <strong id="current-domain">this site</strong></span>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>

      <!-- Footer -->
      <footer class="footer">
        <button class="link" id="open-options" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.3 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          Settings
        </button>
        <button class="link" id="refresh-lists" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          <span id="refresh-label">Update filters</span>
        </button>
      </footer>

      <p class="sr-only" role="status" aria-live="polite" id="live-status">Protection enabled.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
